<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة Voltir Pro - لوحة التحكم</title>
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 15px; }
        .container { max-width: 1000px; margin: auto; }
        .user-row { background: var(--card); border: 1px solid #334155; margin-bottom: 10px; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .user-info-brief { text-align: right; }
        .user-info-brief b { font-size: 1.1em; color: var(--primary); display: block; }
        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.8em; font-weight: bold; }
        #userModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:100; }
        .modal-content { background: var(--card); width: 90%; max-width: 500px; margin: 40px auto; padding: 20px; border-radius: 15px; border: 1px solid var(--primary); }
        .modal-content h3 { color: var(--primary); border-bottom: 1px solid #334155; padding-bottom: 10px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
        .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn { padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-save { background: #22c55e; color: white; }
        .btn-close { background: #64748b; color: white; }
        .btn-action { background: #3b82f6; color: white; font-size: 0.8em; }
    /* استايلات العدادات الإحصائية الجديدة */
        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card); border: 1px solid #334155; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .stat-card h4 { margin: 0 0 5px 0; color: #64748b; font-size: 0.9em; }
        .stat-card div { font-size: 1.8em; font-weight: bold; color: var(--primary); }
        /* أزرار الفلترة */
        .filter-btn { padding: 6px 12px; background: #334155; border: none; color: white; border-radius: 6px; cursor: pointer; font-size: 0.85em; font-weight: bold; transition: 0.2s; }
        .filter-btn.active { background: var(--primary); color: #0f172a; }
        /* أزرار الكارت الجديدة */
        .btn-whatsapp { background: #25d366; color: white; font-size: 0.8em; text-decoration: none; padding: 6px 10px; border-radius: 6px; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; }
        .btn-ban { background: #f97316; color: white; font-size: 0.8em; }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0;">🛡️ إدارة المشتركين</h2>
        <div style="display: flex; gap: 10px;">
            <button onclick="openAddUserModal()" class="btn" style="background: #3b82f6; color: white; padding: 8px 15px;">➕ إضافة مستخدم</button>
            <button id="refreshBtn" onclick="loadUsers()" class="btn btn-action" style="background: #28a745; padding: 8px 15px;">🔄 تحديث البيانات</button>
        </div>
    </div>

    <div class="stats-container">
        <div class="stat-card"><h4>إجمالي المشتركين</h4><div id="stat-total">0</div></div>
        <div class="stat-card"><h4>المشتركين النشطين</h4><div id="stat-active" style="color: #22c55e;">0</div></div>
        <div class="stat-card"><h4>الاشتراكات المنتهية</h4><div id="stat-expired" style="color: #ef4444;">0</div></div>
    </div>

    <input type="text" id="searchInput" onkeyup="filterUsers()" placeholder="🔍 ابحث بالاسم أو الرقم..." style="margin-bottom: 15px;">
    
    <div style="display: flex; gap: 8px; margin-bottom: 20px; align-items: center;">
        <span style="font-size: 0.9em; color: #64748b;">عرض حسب الصلاحية:</span>
        <button id="filter-all" onclick="setFilter('all')" class="filter-btn active">الكل</button>
        <button id="filter-active" onclick="setFilter('active')" class="filter-btn">النشطين فقط</button>
        <button id="filter-expired" onclick="setFilter('expired')" class="filter-btn">المنتهيين فقط</button>
    </div>

    <div id="userList"></div>
</div>

<div id="userModal">
    <div class="modal-content" id="modalData"></div>
</div>

<script>
    const DB_URL = "https://just-scan-19ce1-default-rtdb.firebaseio.com/users";
    let users = [];

    let currentFilter = 'all'; // لمتابعة الفلتر المختار حالياً

    async function loadUsers() {
        const listDiv = document.getElementById('userList');
        const refreshBtn = document.getElementById('refreshBtn');
        if(listDiv) listDiv.innerHTML = "⏳ جاري سحب البيانات...";
        refreshBtn.disabled = true;
        
        try {
            const res = await fetch(`${DB_URL}.json?t=${Date.now()}`);
            if (res.ok) {
                const data = await res.json();
                users = data ? Object.keys(data).map(key => ({ ...data[key], phone: key })) : [];
                
                // 📊 تحديث لوحة العدادات الإحصائية فوراً عند التحميل
                calculateStats(users);
                
                filterUsers(); // تشغيل الفلترة والعرض المظبوط
            } else { alert("خطأ في جلب البيانات"); }
        } catch (e) { alert("خطأ في الشبكة: " + e.message); }
        refreshBtn.disabled = false;
    }

    // دالة التحديث الذكية (تعديل جزء فقط)
    async function updateSingleUser(phone, updatedData, btnElement) {
        const originalText = btnElement ? btnElement.innerText : "";
        if(btnElement) { btnElement.innerText = "⏳ جاري الحفظ..."; btnElement.disabled = true; }

        try {
            const res = await fetch(`${DB_URL}/${phone}.json`, {
                method: 'PATCH',
                body: JSON.stringify(updatedData)
            });

            if (res.ok) {
                alert("✅ تم التحديث بنجاح");
                closeCard();
                loadUsers();
            } else { alert("❌ فشل الحفظ: " + res.status); }
        } catch (e) { alert("❌ خطأ فني: " + e.message); }
        
        if(btnElement) { btnElement.innerText = originalText; btnElement.disabled = false; }
    }

    function calculateStats(allUsers) {
        let active = 0, expired = 0;
        allUsers.forEach(u => {
            const isBanned = u.isBanned === true || u.isBanned === "true";
            const expiry = new Date(parseInt(u.expiryDate) || 0);
            const isExpired = (expiry - Date.now()) <= 0;
            
            if (isBanned || isExpired) { expired++; } else { active++; }
        });
        document.getElementById('stat-total').innerText = allUsers.length;
        document.getElementById('stat-active').innerText = active;
        document.getElementById('stat-expired').innerText = expired;
    }

    function renderUsers(data) {
        const container = document.getElementById('userList');
        if(!container) return;
        container.innerHTML = '';
        
        if(data.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:20px; color:#64748b;">🚫 لا توجد بيانات مطابقة للبحث أو الفلتر</div>';
            return;
        }

        data.forEach(user => {
            const isBanned = user.isBanned === true || user.isBanned === "true";
            const expiry = new Date(parseInt(user.expiryDate) || 0);
            const daysLeft = Math.ceil((expiry - Date.now()) / (1000 * 60 * 60 * 24));
            
            let statusText = daysLeft > 0 ? 'باقي ' + daysLeft + ' يوم' : 'منتهي';
            let statusColor = daysLeft > 0 ? '#22c55e' : '#ef4444';
            
            // لو الحساب محظور نغير حالته علطول
            if(isBanned) { statusText = "🚫 محظور"; statusColor = "#f97316"; }

            container.innerHTML += `
                <div class="user-row" style="${isBanned ? 'border-color: #f97316; opacity: 0.85;' : ''}">
                    <div class="user-info-brief">
                        <b>${user.name} ${isBanned ? '<span style="color:#f97316; font-size:0.8em;">(حساب معطل)</span>' : ''}</b>
                        <span>📱 ${user.phone} | 🏢 ${user.activity || 'بدون نشاط'}</span>
                    </div>
                    <div style="text-align: left; display: flex; align-items: center; gap: 8px;">
                        <span class="status-pill" style="border: 1px solid ${statusColor}; color: ${statusColor}">
                            ${statusText}
                        </span>
                        <a href="https://wa.me/${user.phone.startsWith('2') ? user.phone : '2' + user.phone}" target="_blank" class="btn-whatsapp" title="تواصل واتساب">💬 مراسلة</a>
                        <button class="btn btn-action" onclick="openCard('${user.phone}')">تعديل البطاقة ⚙️</button>
                    </div>
                </div>`;
        });
    }

    function openCard(phone) {
        const user = users.find(u => u.phone === phone);
        const modal = document.getElementById('userModal');
        const content = document.getElementById('modalData');
        if(!modal || !content) return;
        
        const isBanned = user.isBanned === true || user.isBanned === "true";
        // قراءة عدد الأجهزة المفتوحة حالياً (لو مش موجودة بنعتبرها 0)
        const activeSessions = user.activeSessions || 0;
        
        content.innerHTML = `
            <h3>🪪 بطاقة: ${user.name}</h3>
            <div style="background: #0f172a; padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #334155; text-align: center;">
                📱 الأجهزة المتصلة حالياً: <b style="color: var(--primary); font-size: 1.2em;">${activeSessions} / 2</b>
                <button class="btn" style="background: #64748b; padding: 3px 8px; font-size: 0.85em; margin-right: 10px;" onclick="resetDevices(this, '${user.phone}')">🔄 تصفير الأجهزة</button>
            </div>
            <label>الاسم:</label> <input type="text" id="m-name" value="${user.name}">
            <label>النشاط:</label> <input type="text" id="m-act" value="${user.activity || ''}">
            <label>الباسورد:</label> <input type="text" id="m-pass" value="${user.password || ''}">
            <button class="btn btn-save" style="width:100%" onclick="saveFullUpdate(this, '${user.phone}')">حفظ التغييرات الأساسية</button>
            <hr style="border:0; border-top:1px solid #334155; margin:15px 0;">
            <label>➕ إضافة أيام محددة:</label>
            <div style="display:flex; gap:5px;">
                <input type="number" id="m-days" placeholder="عدد الأيام" style="margin:0;">
                <button class="btn btn-save" onclick="addCustomDays(this, '${user.phone}')">إضافة</button>
            </div>
            <div class="grid-btns">
                <button class="btn btn-action" onclick="setPreset(this, '${user.phone}', 30)">شهر جديد</button>
                <button class="btn btn-action" onclick="setPreset(this, '${user.phone}', 90)">3 شهور</button>
                <button class="btn btn-action" onclick="setPreset(this, '${user.phone}', 180)">6 شهور</button>
                <button class="btn btn-action" onclick="setPreset(this, '${user.phone}', 365)">سنة جديدة</button>
                
                <button class="btn btn-ban" style="background: ${isBanned ? '#22c55e' : '#f97316'}" onclick="toggleBanUser(this, '${user.phone}', ${isBanned})">
                    ${isBanned ? '🔓 تفعيل الحساب' : '🚫 تعطيل الحساب'}
                </button>
                
                <button class="btn btn-action" style="background:#ef4444" onclick="deleteUser(this, '${user.phone}')">حذف الحساب</button>
                <button class="btn btn-close" style="grid-column: span 2;" onclick="closeCard()">إغلاق</button>
            </div>
        `;
        modal.style.display = 'block';
    }

    function closeCard() { document.getElementById('userModal').style.display = 'none'; }

    async function saveFullUpdate(btn, phone) {
        const data = {
            name: document.getElementById('m-name').value,
            activity: document.getElementById('m-act').value,
            password: document.getElementById('m-pass').value
        };
        await updateSingleUser(phone, data, btn);
    }

    async function addCustomDays(btn, phone) {
        const daysInput = document.getElementById('m-days');
        const days = parseInt(daysInput.value);
        if(!days) return alert("اكتب عدد الأيام");
        
        const user = users.find(u => u.phone === phone);
        let currentExpiry = parseInt(user.expiryDate) || Date.now();
        const newExpiry = (Math.max(Date.now(), currentExpiry) + (days * 24 * 60 * 60 * 1000)).toString();
        
        await updateSingleUser(phone, { expiryDate: newExpiry }, btn);
    }

    async function setPreset(btn, phone, days) {
        const newExpiry = (Date.now() + (days * 24 * 60 * 60 * 1000)).toString();
        await updateSingleUser(phone, { expiryDate: newExpiry }, btn);
    }

    async function deleteUser(btn, phone) {
        if(confirm("حذف نهائي؟")) {
            btn.innerText = "⏳ جاري الحذف...";
            btn.disabled = true;
            try {
                const res = await fetch(`${DB_URL}/${phone}.json`, { method: 'DELETE' });
                if (res.ok) {
                    alert("✅ تم الحذف");
                    closeCard();
                    loadUsers();
                }
            } catch (e) { alert("خطأ: " + e.message); }
        }
    }

    // 🔍 دالة الفلترة والبحث المدمجة والمطورة
    function filterUsers() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        
        const filtered = users.filter(u => {
            // أولاً: تطبيق فلتر البحث بالاسم أو الرقم
            const matchesSearch = u.name.toLowerCase().includes(term) || u.phone.includes(term);
            if (!matchesSearch) return false;
            
            // ثانياً: تطبيق فلاتر الأزرار (نشط / منتهي)
            const isBanned = u.isBanned === true || u.isBanned === "true";
            const expiry = new Date(parseInt(u.expiryDate) || 0);
            const isExpired = (expiry - Date.now()) <= 0;
            
            if (currentFilter === 'active') {
                return !isBanned && !isExpired;
            } else if (currentFilter === 'expired') {
                return isBanned || isExpired;
            }
            return true; // في حالة 'all' (الكل)
        });
        
        renderUsers(filtered);
    }

    // لتغيير لون زرار الفلتر النشط حالياً واختيار التصنيف
    function setFilter(filterType) {
        currentFilter = filterType;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`filter-${filterType}`).classList.add('active');
        filterUsers();
    }

    // 🚫 دالة حظر / إلغاء حظر المستخدم
    async function toggleBanUser(btn, phone, isBanned) {
        const confirmMsg = isBanned ? "هل تريد إلغاء حظر هذا الحساب وتفعيله؟" : "هل تريد تعطيل هذا الحساب؟ لن يتمكن العميل من الدخول.";
        if(confirm(confirmMsg)) {
            await updateSingleUser(phone, { isBanned: !isBanned }, btn);
        }
    }

    // 🔄 دالة تصفير الأجهزة النشطة (activeSessions) لليوزر
    async function resetDevices(btn, phone) {
        if(confirm("هل تريد تصفير الأجهزة النشطة لهذا الحساب؟ سيتمكن من تسجيل الدخول من جديد.")) {
            await updateSingleUser(phone, { activeSessions: 0 }, btn);
        }
    }

    // ➕ فتح كارت منبثق لإنشاء مستخدم جديد تماماً
    function openAddUserModal() {
        const modal = document.getElementById('userModal');
        const content = document.getElementById('modalData');
        if(!modal || !content) return;
        
        content.innerHTML = `
            <h3>➕ إضافة مشترك جديد يدوياً</h3>
            <label>رقم الهاتف (سيكون هو الحساب والرقم السري لاحقاً):</label> 
            <input type="text" id="add-phone" placeholder="مثال: 01147534998">
            <label>اسم المشترك:</label> 
            <input type="text" id="add-name" placeholder="اكتب اسم العميل">
            <label>اسم النشاط التجاري:</label> 
            <input type="text" id="add-act" placeholder="مثال: صيدلية، مخزن...">
            <label>كلمة السر:</label> 
            <input type="text" id="add-pass" placeholder="اكتب كلمة سر الحساب">
            <label>مدة تفعيل الحساب الأولية:</label>
            <select id="add-duration">
                <option value="30">شهر واحد</option>
                <option value="90">3 شهور</option>
                <option value="180">6 شهور</option>
                <option value="365">سنة كاملة</option>
                <option value="7">فترة تجريبية (7 أيام)</option>
            </select>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="btn btn-save" style="width:100%" onclick="saveNewUser(this)">🚀 إنشاء الحساب وتفعيله</button>
                <button class="btn btn-close" onclick="closeCard()">إلغاء</button>
            </div>
        `;
        modal.style.display = 'block';
    }

    // حفظ العميل الجديد في قاعدة البيانات
    async function saveNewUser(btn) {
        const phone = document.getElementById('add-phone').value.trim();
        const name = document.getElementById('add-name').value.trim();
        const activity = document.getElementById('add-act').value.trim();
        const password = document.getElementById('add-pass').value.trim();
        const days = parseInt(document.getElementById('add-duration').value);

        if(!phone || !name || !password) {
            return alert("❌ برجاء ملء الحقول الأساسية: الرقم، الاسم، والباسورد.");
        }

        btn.innerText = "⏳ جاري الإنشاء...";
        btn.disabled = true;

        // حساب تاريخ انتهاء الاشتراك بناءً على المدة المختارة
        const expiryDate = (Date.now() + (days * 24 * 60 * 60 * 1000)).toString();

        const newUserPayload = {
            name: name,
            activity: activity,
            password: password,
            expiryDate: expiryDate,
            isBanned: false,
            activeSessions: 0 // بيبدأ بـ 0 أجهزة مفتوحة
        };

        try {
            const res = await fetch(`${DB_URL}/${phone}.json`, {
                method: 'PUT',
                body: JSON.stringify(newUserPayload)
            });

            if(res.ok) {
                alert("🎉 تم إنشاء الحساب المشترك وتفعيله بنجاح!");
                closeCard();
                loadUsers();
            } else { alert("❌ فشل الاتصال بالسيرفر أثناء الحفظ."); }
        } catch(e) { alert("❌ خطأ فني: " + e.message); }
        
        btn.disabled = false;
        btn.innerText = "🚀 إنشاء الحساب وتفعيله";
    }

    window.onload = loadUsers;
</script>
</body>
</html>
