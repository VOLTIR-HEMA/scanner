<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Just Scan Pro - Total Edition</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary: #3d60cc;
            --primary-hover: #2e49a3;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #334155;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.5;
            overflow-x: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:active { transform: scale(0.9); background: var(--border); }
        .icon-btn.active { background: var(--primary); border-color: var(--primary); }

        .scanner-section {
            width: 100%;
            max-width: 600px;
            margin: 10px auto;
            position: relative;
            padding: 0 10px;
        }

       #reader {
            width: 100% !important;
            max-width: 380px !important; 
            height: 250px !important; 
            border: 2px solid var(--border) !important;
            border-radius: 20px !important;
            margin: 5px auto !important; 
            overflow: hidden;
            background: #000 !important;
        }

        #reader video {
            object-fit: cover !important;
            height: 250px !important;
        }

        .result-container {
            margin: 15px;
            padding: 15px;
            background: var(--card-bg);
            border-radius: 15px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status-online { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        .status-offline { background: rgba(245, 158, 11, 0.2); color: var(--warning); }

        #result-text {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            color: var(--success);
            word-break: break-all;
            min-height: 1.5em;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 10px 15px;
            max-width: 600px;
            margin: 0 auto 80px;
        }

        .custom-btn {
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 15px;
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
            gap: 5px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .custom-btn:active { transform: translateY(2px); box-shadow: none; }

        #bill-panel {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70vh;
            background: var(--bg-dark);
            border-top: 2px solid var(--primary);
            z-index: 1500;
            border-radius: 30px 30px 0 0;
            padding: 20px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
            overflow-y: auto;
        }

        .bill-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .slot-item {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-body {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 25px;
            max-width: 500px;
            margin: 40px auto;
            border: 1px solid var(--border);
        }
/* 1. غطاء شفاف مخصص لنافذة الإرسال اليدوي */
/* يضمن تعتيم الشاشة بنسبة 80% خلف النافذة */
.manual-send-overlay {

}

/* 2. تصميم النافذة المنبثقة للإرسال */
.manual-send-popup {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%); /* يضع النافذة في منتصف الشاشة تماماً */
    background: #1a1a1a; /* خلفية داكنة تناسب تصميمك */
    padding: 20px;
    border-radius: 20px;
    border: 2px solid #6c5ce7; /* إطار بلون مميز لتمييز نظام المشتريات */
    z-index: 3001;
    width: 90%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

/* 3. تنسيق نص الكود داخل النافذة */
.manual-code-text {
    font-size: 1.5rem;
    font-weight: bold;
    color: #ffffff;
    margin: 20px 0;
    letter-spacing: 2px; /* تباعد الحروف لجعل الكود أسهل في القراءة */
}
        input[type="text"], input[type="tel"], input[type="password"], input[type="number"] {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: #000;
            border: 1px solid var(--border);
            color: white;
            border-radius: 12px;
            font-size: 1rem;

        .save-btn {

        #lock-screen {

            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;

        .lock-icon { font-size: 80px; color: var(--danger); margin-bottom: 20px; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pulse { animation: pulse 2s infinite; }

    </style>
</head>

// 2. دالة إعادة إرسال الكود الحالي فقط
function reSendCurrent() {
    const items = proSlots[activeProSlotForSend];
    if (items[currentProIndex]) {
        masterSend(items[currentProIndex] + '_ent');
    }
}

// 3. دالة الانتقال لرقم صنف معين
function jumpToProItem() {
    const newIndex = parseInt(document.getElementById('goToIndex').value) - 1;
    const items = proSlots[activeProSlotForSend];
    if (newIndex >= 0 && newIndex < items.length) {
        currentProIndex = newIndex;

        alert("رقم الصنف غير موجود!");

        // --- الثوابت والبيانات ---
        // --- الثوابت والبيانات الموحدة (ضعها مرة واحدة فقط) ---
const WHATSAPP_RENEW = "201147534998";
const DB_URL = "https://just-scan-19ce1-default-rtdb.firebaseio.com/users";
let lastScanTime = 0;
let isFlashOn = false;
let html5Scanner = null;

// تعريف متغيرات الفواتير (مرة واحدة فقط)
let activeSlotIndex = null;
let activeProSlotIndex = null;
let activeProSlotForSend = 0;
let currentProIndex = 0;
let currentProItemIndex = 0; 

// استعادة المصفوفات من التخزين المحلي
let slots = JSON.parse(localStorage.getItem('v_slots')) || Array(10).fill().map(() => []);
let slotNames = JSON.parse(localStorage.getItem('v_slot_names')) || Array(10).fill().map((_, i) => `فاتورة ${i + 1}`);
let proSlots = JSON.parse(localStorage.getItem('v_pro_slots')) || Array(5).fill().map(() => []);
let proSlotNames = JSON.parse(localStorage.getItem('v_pro_slot_names')) || Array(5).fill().map((_, i) => `مشتريات ${i + 1}`);
        // دالة تحديث السحابة (Firebase)
        async function pushToCloud() {
            const phone = localStorage.getItem('v_phone');
            if (!phone) return;
            try {
                const dataToSave = {
                    customButtons: configButtons,
                    savedBills: slots,
                    slotNames: slotNames,
                    lastUpdate: new Date().getTime()
                };
                // تم توحيد اسم المتغير لـ DB_URL
                await fetch(`${DB_URL}/${phone}.json`, {
                    method: 'PATCH',
                    body: JSON.stringify(dataToSave)
                });
                console.log("Cloud synced successfully via Firebase");
            } catch (e) { console.error("Cloud Sync Error", e); }
        }

        // استعادة البيانات من التخزين
        let configButtons = JSON.parse(localStorage.getItem('userButtons')) || [
            { name: "جديد", cmd: "f8", useEnter: true, color: "#3d60cc" },
            { name: "حفظ", cmd: "f9", useEnter: true, color: "#3d60cc" },
            { name: "بحث", cmd: "f10", useEnter: false, color: "#166534" },
            { name: "خروج", cmd: "esc", useEnter: false, color: "#991b1b" }
        ];

        function isSubscribed(expiry) {
            if (!expiry) return false;
            const expiryDate = new Date(isNaN(expiry) ? expiry : parseInt(expiry));
            return expiryDate.getTime() > Date.now();
        }

        // دالة السحب من Firebase
        async function syncData(manual = false) {
            const phone = localStorage.getItem('v_phone');
            if (!phone) return;
            try {
                // تم توحيد اسم المتغير لـ DB_URL
                const res = await fetch(`${DB_URL}/${phone}.json?t=${Date.now()}`);
                const user = await res.json();
                if (user) {
                    localStorage.setItem('v_expiry', user.expiryDate);
                    localStorage.setItem('v_name', user.name);
                    if (user.customButtons) {
                        configButtons = user.customButtons;
                        localStorage.setItem('userButtons', JSON.stringify(configButtons));
                        renderMainButtons();
                    }
                   // التأكد من أن الفواتير القادمة من السحابة تحتوي على بيانات فعلاً
if (user.savedBills && Array.isArray(user.savedBills) && user.savedBills.some(bill => bill.length > 0)) {
    slots = user.savedBills;
    localStorage.setItem('v_slots', JSON.stringify(slots));
} else {
    // إذا كانت السحابة فارغة، نحتفظ بالفواتير الموجودة حالياً في الجهاز
    console.log("السحابة لا تحتوي على فواتير، تم الاحتفاظ بالبيانات المحلية.");
}
                    if (user.slotNames) {
                        slotNames = user.slotNames;
                        localStorage.setItem('v_slot_names', JSON.stringify(slotNames));
                    }
                    if (!isSubscribed(user.expiryDate)) showLockScreen(user.name, phone);
                    else document.getElementById('lock-screen').style.display = 'none';
                    renderAuthStatus();
                    if (manual) alert("✅ تم تحديث البيانات من السحابة");
                }
            } catch (err) { console.error("Sync failed", err); }
        }

        function showLockScreen(name, phone) {
            const lock = document.getElementById('lock-screen');
            lock.style.display = 'flex';
            document.getElementById('lock-message').innerText = `يا ${name}، انتهت صلاحية اشتراكك لهذا الرقم (${phone}). يرجى التواصل مع الإدارة للتجديد.`;
            document.getElementById('whatsapp-renewal').href = `https://wa.me/${WHATSAPP_RENEW}?text=${encodeURIComponent('تجديد اشتراك رقم: ' + phone)}`;
        }

        function masterSend(message) {
            const phone = localStorage.getItem('v_phone');
            const expiry = localStorage.getItem('v_expiry');
            if (!phone) { openSettings(); return; }
            if (!isSubscribed(expiry)) { showLockScreen(localStorage.getItem('v_name'), phone); return; }
            fetch(`https://ntfy.sh/voltir_${phone}`, { method: 'POST', body: message }).catch(e => console.log("Network error"));
        }

        function onScanSuccess(text) {
            if (Date.now() - lastScanTime < 2000) return;
            lastScanTime = Date.now();
            // 1. فحص إذا كانت هناك فاتورة "عادية" نشطة
if (activeSlotIndex !== null) {
    if (slots[activeSlotIndex].length >= 30) return alert("⚠️ الفاتورة ممتلئة!");
    slots[activeSlotIndex].push(text);
    localStorage.setItem('v_slots', JSON.stringify(slots));
    renderSlots();
    pushToCloud();
    document.getElementById('result-text').innerText = `✅ تم الحفظ في ${slotNames[activeSlotIndex]}`;
} 
// 2. فحص إذا كانت هناك فاتورة "مشتريات Pro" نشطة (الإضافة الجديدة)

async function sendAndMoveToNext() {
    // 1. الوصول لبيانات الفاتورة المفتوحة حالياً
    const items = proSlots[activeProSlotForSend];
    let code = items[currentProIndex];

    // 2. التحقق من وجود أكواد متبقية للإرسال
    if (currentProIndex >= items.length) {
        alert("✅ انتهت جميع الأكواد في هذه القائمة");
        closeSendModal();
        return;
    }

    // 3. استدعاء دالة الإرسال الأساسية (masterSend)
    // نرسل الكود مضافاً إليه كلمة _ent كما هو متبع في نظامك
    masterSend(code + '_ent');
    
    // 4. إضافة علامة الصح ✅ للكود في المصفوفة لتمييزه
    if (!code.includes(' ✅')) {
        items[currentProIndex] = code + ' ✅';
    }
    
    // 5. حفظ التعديلات في ذاكرة المتصفح (localStorage) بشكل دائم
    localStorage.setItem('v_pro_slots', JSON.stringify(proSlots));
    
    // 6. الانتقال للمؤشر التالي (الكود الذي يليه)
    currentProIndex++;

    // 7. تحديث واجهة المستخدم
    if (currentProIndex < items.length) {
        updateModalContent(); // تحديث النص المعروض في النافذة المنبثقة
    } else {
        alert("🎉 تم إرسال آخر كود بنجاح");
        closeSendModal();
    }
    
    // إعادة رسم قائمة الفواتير الخلفية لتحديث علامات الصح فيها
    if (typeof renderProSlots === "function") renderProSlots();
}

        window.activeProSlotIndex = null;

// زرع الدالة اللي الزرار بيدور عليها ومش لاقيها
window.openManualSendControls = function(index) {
    // 1. تحديد القائمة بناءً على الزرار اللي اتداس
    activeProSlotForSend = index;
    currentProIndex = 0; 

    // 2. التأكد إن فيه أصناف فعلاً
    const items = proSlots[index];
    if (!items || items.length === 0) {
        alert("⚠️ الفاتورة دي فاضية، مفيش حاجة تتبعت!");
        return;
    }

    // 3. إظهار المربع اللي اسمه manual-send-controls
    const controlPanel = document.getElementById('manual-send-controls');
    if (controlPanel) {
        controlPanel.style.display = 'block';
        // نزول الشاشة للمربع عشان تشوفه لو الصفحة طويلة
        controlPanel.scrollIntoView({ behavior: 'smooth' });
        
        // 4. تشغيل الدالة اللي بتملا المربع بالزراير والبيانات
        if (typeof updateModalContent === 'function') {
            updateModalContent();
        }
    } else {
        alert("❌ مشكلة: المربع (manual-send-controls) مش موجود في الـ HTML!");
    }
};

    if (confirm("⚠️ هل تريد مسح أصناف فاتورة مشتريات " + (index + 1) + "؟")) {
        proSlots[index] = [];
        localStorage.setItem('v_pro_slots', JSON.stringify(proSlots));
        renderProSlots();
    }
}
        // دالة تفعيل فاتورة المشتريات (Pro)
function setActiveProSlot(index) {
    // لو الفاتورة اللي دوسنا عليها هي اللي شغالة أصلاً، بنلغي تفعيلها (null)
    // لو فاتورة تانية، بنخليها هي النشطة
    if (activeProSlotIndex === index) {
        activeProSlotIndex = null;
    } else {
        activeProSlotIndex = index;
        activeSlotIndex = null; // بنقفل أي فاتورة عادية عشان مبيحصلش تداخل
    }
    
    // أهم خطوة: إعادة رسم الواجهة عشان الألوان تتحدث فوراً
    renderProSlots();
}
// دالة مسح الفاتورة العادية
function clearSlot(i) { 
    if(confirm("تفريغ الفاتورة؟")) { 
        slots[i] = [];
        localStorage.setItem('v_slots', JSON.stringify(slots)); 
        renderSlots(); 
        pushToCloud(); 
    } 
}
    </script>
    <!-- غطاء خلفي شفاف لتعتيم الشاشة عند ظهور النافذة -->
<div id="modal-overlay" class="modal-overlay" onclick="closeSendModal()"></div>

<!-- النافذة المنبثقة للإرسال اليدوي -->
<div id="manual-send-modal" class="manual-send-modal">
    <!-- منطقة عرض الكود الحالي -->
    <div id="code-to-send-display"></div>
    
    <!-- أزرار التحكم في الإرسال -->
    <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
        <button id="btn-next-send" onclick="sendAndMoveToNext()" style="background: var(--success); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; flex: 1; font-weight: bold;">
            إرسال (التالي) 📤
        </button>
        <button onclick="closeSendModal()" style="background: #444; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer;">
            إلغاء ❌
        </button>
    </div>
</div>
